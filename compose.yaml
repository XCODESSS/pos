name: counterline
services:
  db:
    restart: unless-stopped
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: counterline
      POSTGRES_USER: counterline
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - counterline-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counterline"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    restart: unless-stopped
    build: ./backend
    environment:
      JDBC_URL: jdbc:postgresql://db:5432/counterline
      DB_USER: counterline
      DB_PASSWORD: ${DB_PASSWORD}
      OWNER_USERNAME: ${OWNER_USERNAME:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "-cp", "/app/lib/*", "in.counterline.HealthCheck"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 3
  web:
    restart: unless-stopped
    build: ./web
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  counterline-db:
