name: Counterline
options:
  bundleIdPrefix: in.counterline
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Counterline:
    type: application
    platform: iOS
    sources: [Counterline]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.counterline.pos
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_STYLE: Automatic
schemes:
  Counterline:
    build:
      targets:
        Counterline: all
