services:
  db:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${VERIFY_DB_PASSWORD:?runner-generated password required}
      VERIFY_ALPHA_DB_PASSWORD: ${VERIFY_ALPHA_DB_PASSWORD}
      VERIFY_BETA_DB_PASSWORD: ${VERIFY_BETA_DB_PASSWORD}
    volumes:
      - data:/var/lib/postgresql/data
      - ./init-tenants.sh:/docker-entrypoint-initdb.d/tenants.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    image: ${VERIFY_PROJECT:?runner project required}-backend
    build:
      context: ../backend
      labels:
        org.opencontainers.image.revision: ${VERIFY_SOURCE_REVISION:-worktree}
    environment:
      TENANTS_JSON: ${VERIFY_TENANTS_JSON:?runner registry required}
      APP_ENV: ${VERIFY_APP_ENV:-verification}
      HOST: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, java, -cp, '/app/lib/*', in.counterline.HealthCheck]
      interval: 2s
      timeout: 5s
      start_period: 30s
      retries: 30
  web:
    image: ${VERIFY_PROJECT}-web
    build:
      context: ../web
      labels:
        org.opencontainers.image.revision: ${VERIFY_SOURCE_REVISION:-worktree}
    ports:
      - '127.0.0.1::80'
    depends_on:
      backend:
        condition: service_healthy
volumes:
  data:
